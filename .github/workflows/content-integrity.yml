name: Content Integrity

on:
  pull_request:
    branches: [main]
    # The guard script scans all of src/ (chapter pages, widgets, lib, layouts,
    # components), not just src/pages/. Keep this path filter as wide as the
    # guard's own scope so a widget-only or lib-only change still triggers it.
    # Narrower filters here previously let two real regressions ship without
    # CI ever running: a leaked build-session comment in a widget data file,
    # and a stale relationship-type literal in src/lib/.
    paths:
      - 'src/**'
      - 'scripts/check-content-integrity.mjs'
      - 'scripts/check-active-workflow.mjs'
      - 'scripts/check-runnable-code.mjs'
      - 'scripts/check-widget-data.mjs'
      - '.claude/**'
      - '.codex/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'docs/CODEX_WORKFLOW.md'
      - 'package.json'
  workflow_dispatch:

jobs:
  check-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check content integrity
        run: |
          node scripts/check-active-workflow.mjs
          node scripts/check-content-integrity.mjs
          node scripts/check-runnable-code.mjs
          node scripts/check-widget-data.mjs
